name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: |
          python -m py_compile watermark_app/core/collage.py watermark_app/core/collage_groups.py watermark_app/ui/common.py watermark_app/ui/collage_selector.py watermark_app/ui/collage_panel.py watermark_app/ui/main_window.py app.py scripts/smoke_collage.py tests/test_collage.py tests/test_collage_ui.py
          python -m unittest tests.test_collage tests.test_collage_ui
          python scripts/smoke_collage.py

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name CoderleexWatermark --add-data "assets;assets" --add-data "waterTmp;waterTmp" --collect-all PySide6 --collect-all qfluentwidgets app.py

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist\CoderleexWatermark\* -DestinationPath CoderleexWatermark-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoderleexWatermark-Windows
          path: CoderleexWatermark-Windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CoderleexWatermark-Windows.zip
